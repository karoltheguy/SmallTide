[workspace]
resolver = "2"
members = [
    "crates/smalltide-core",
    "crates/smalltide-io",
    "crates/smalltide-tide",
    "crates/smalltide-model-inkling2",
    "crates/smalltide-backend-hip",
    "crates/smalltide-backend-cpu",
    "crates/smalltide-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
